[package]
name = "driveguardian"
version = "0.1.0"
description = "DriveGuardian - Adaptive AI Storage Optimization"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "shell-sidecar", "shell-execute", "dialog-open", "system-tray", "notification-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
custom-protocol = ["tauri/custom-protocol"]
